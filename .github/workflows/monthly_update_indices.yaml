name: Update indices company list  

on:
  schedule:
    # Monthly on the 6th, 00:00 UTC (13:00 WIB). IDX reviews (Mayor/Minor) take force on the first
    # trading day of their review month - Feb/May/Aug/Nov for BEI indices, Jun/Sep/Dec for
    # JII70/SRI-KEHATI/ECONOMIC30/IDXVESTA28, factor family 2 days later - so the day is the 1st-5th
    # and a run on the 1st reads the previous period instead. The 6th is the first date guaranteed to
    # see all of them (<=5 days lag). Incidental reviews (e.g. LQ45 on 2026-11-18) are rare:
    # dispatch this workflow when one is published.
    - cron: "0 0 6 * *"
  
  workflow_dispatch:
      

jobs:
  build:
    runs-on: ubuntu-latest

    env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        PROXY : ${{ secrets.PROXY }}
        
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.12 # Replace with your desired Python version
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run Download zip files
      run: python indices_zip_data_scraper.py

    - name: Run Update companies list indices and push to db
      run: python data_automation.py

    - name: Pull Latest Changes
      run: git pull origin main

    - name: commit files
      run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add company_list 
          git diff-index --quiet HEAD || (git commit -m "Update company list indices" --allow-empty)
          
    - name: push changes
      uses: ad-m/github-push-action@v0.6.0
      with:
        github_token: ${{ secrets.TOKEN_GITHUB }}
        branch: main 